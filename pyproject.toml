[project]
name = "md2kindle"
version = "2.0.0"
description = "MangaDex to Kindle CLI converter — descarga, convierte y entrega manga a e-readers"
readme = "README.md"
requires-python = ">=3.13, <3.14"
license = "MIT"

dependencies = [
    "requests",
    "mangadex-downloader>=1.0.0",
    "chardet>=3.0.2,<6.0.0",
    "python-dotenv",
    "boto3",
]

[project.scripts]
md2kindle = "md2kindle.app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_return_any = true
warn_unused_configs = true

[tool.setuptools.packages.find]
where = ["."]
include = ["md2kindle*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
