name: Manga Pipeline (R2 & Telegram)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL de MangaDex (manga o capítulo)'
        required: true
      mode:
        description: 'Modo: v (volumen) o c (capítulo)'
        required: true
        default: 'v'
        type: choice
        options:
          - v
          - c
      start:
        description: 'Número inicial'
        required: true
        default: '1'
      end:
        description: 'Número final (Vacio = Solo el inicial)'
        required: false
      lang:
        description: 'Idioma (es-la, en, es)'
        required: true
        default: 'es-la'
      skip_oneshots:
        description: 'Omitir capítulos Oneshot'
        required: true
        default: true
        type: boolean
      use_r2:
        description: 'Cloudflare R2 (Link por Telegram)'
        required: true
        default: true
        type: boolean
      use_telegram:
        description: 'Telegram (Archivo Directo + ffsend fallback)'
        required: true
        default: true
        type: boolean

jobs:
  convert:
    name: Download and Convert
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd835c2494553250106260a927a3c306d # v5.0.0

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full libpng-dev libjpeg-dev

      - name: Install KindleGen
        run: |
          wget https://github.com/Technosoft2000/docker-calibre-web/releases/download/kindlegen/kindlegen_linux_2.6_i386_v2_9.tar.gz
          tar -xzf kindlegen_linux_2.6_i386_v2_9.tar.gz
          sudo mv kindlegen /usr/local/bin/
          kindlegen -locale en || true # Verificar instalación

      - name: Install ffsend
        run: |
          wget https://github.com/timvisee/ffsend/releases/download/v0.2.77/ffsend-v0.2.77-linux-x64-static
          mv ffsend-v0.2.77-linux-x64-static ffsend
          chmod a+x ffsend
          sudo mv ffsend /usr/local/bin/
          ffsend --version

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade requests urllib3
          pip install .
          pip install git+https://github.com/ciromattia/kcc.git

      - name: Run md2kindle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          INPUT_URL: ${{ github.event.inputs.url }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_START: ${{ github.event.inputs.start }}
          INPUT_END: ${{ github.event.inputs.end }}
          INPUT_LANG: ${{ github.event.inputs.lang }}
          INPUT_SKIP_ONESHOTS: ${{ github.event.inputs.skip_oneshots }}
          INPUT_USE_R2: ${{ github.event.inputs.use_r2 }}
          INPUT_USE_TELEGRAM: ${{ github.event.inputs.use_telegram }}
        run: |
          # Construir comando usando un array de Bash para evitar la inyección de código
          ARGS=(
            --url "$INPUT_URL"
            --mode "$INPUT_MODE"
            --start "$INPUT_START"
            --lang "$INPUT_LANG"
          )
          
          if [ -n "$INPUT_END" ]; then
            ARGS+=(--end "$INPUT_END")
          fi
          
          if [ "$INPUT_SKIP_ONESHOTS" = "true" ]; then
            ARGS+=(--skip-oneshots)
          fi
          
          if [ "$INPUT_USE_R2" = "true" ]; then
            ARGS+=(--r2)
          fi

          if [ "$INPUT_USE_TELEGRAM" = "true" ]; then
            ARGS+=(--telegram)
          fi
          
          echo "Ejecutando: python -m md2kindle ${ARGS[@]}"
          python -m md2kindle "${ARGS[@]}"
